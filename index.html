<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Stealth Ops Prototype</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0a0a0f;font-family:sans-serif;touch-action:none;}
  #game{display:block;background:#111;}
  #hud{position:fixed;top:8px;left:8px;right:8px;color:#eee;font-size:13px;pointer-events:none;text-shadow:0 1px 2px #000;}
  #detBarWrap{width:160px;height:10px;background:#333;border:1px solid #555;border-radius:4px;overflow:hidden;margin-top:4px;}
  #detBar{height:100%;width:0%;background:#e0a030;transition:width 0.1s;}
  #detBar.alert{background:#e03030;}
  #stateText{font-weight:bold;margin-top:2px;}
  #msg{position:fixed;top:44px;left:50%;transform:translateX(-50%);color:#fff;font-size:15px;
       background:rgba(0,0,0,0.5);padding:4px 10px;border-radius:6px;display:none;}
  #joyZone{position:fixed;left:0;bottom:0;width:45%;height:45%;}
  #joyBase{position:absolute;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,0.12);
       border:2px solid rgba(255,255,255,0.3);display:none;}
  #joyStick{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.5);display:none;}
  #btns{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-end;}
  .btn{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.4);
       color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;text-align:center;user-select:none;}
  .btn:active{background:rgba(255,255,255,0.35);}
  #btnAction{width:76px;height:76px;font-size:12px;}
  #execOverlay{position:fixed;inset:0;background:#600;display:none;align-items:center;justify-content:center;
       color:#fff;font-size:34px;font-weight:bold;letter-spacing:4px;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="stateText">잠입중</div>
  <div id="detBarWrap"><div id="detBar"></div></div>
</div>
<div id="msg"></div>

<div id="joyZone">
  <div id="joyBase"></div>
  <div id="joyStick"></div>
</div>
<div id="btns">
  <div class="btn" id="btnFlash">라이트</div>
  <div class="btn" id="btnCrouch">웅크리기</div>
  <div class="btn" id="btnAction">처치/상호작용</div>
</div>
<div id="execOverlay">처형됨<br><span style="font-size:16px;">체크포인트에서 재시작...</span></div>

<script>
/* ===================== 기본 설정 ===================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resize(); window.addEventListener('resize',resize);

const WORLD_W = 1400, WORLD_H = 1000;

/* 벽 데이터 (집 구조 간단 버전) */
const walls = [
  {x:0,y:0,w:WORLD_W,h:20},{x:0,y:0,w:20,h:WORLD_H},
  {x:0,y:WORLD_H-20,w:WORLD_W,h:20},{x:WORLD_W-20,y:0,w:20,h:WORLD_H},
  {x:200,y:0,w:20,h:260},
  {x:200,y:340,w:20,h:260},
  {x:600,y:120,w:20,h:480},
  {x:0,y:600,w:420,h:20},
  {x:900,y:0,w:20,h:300},
  {x:900,y:420,w:20,h:300}
];

const checkpoint = {x:120,y:120};
const missionObj = {x:1150,y:180,r:16,done:false};
let player = {x:checkpoint.x,y:checkpoint.y,r:12,speed:2.4,angle:0,crouch:false,flashOn:true};

const enemies = [
  {x:400,y:150,r:12,angle:0,speed:1.1,state:'patrol',
   path:[{x:400,y:150},{x:400,y:450},{x:750,y:450},{x:750,y:150}],wp:0,
   detect:0,visionRange:230,visionAngle:50,target:null,searchTimer:0},
  {x:1050,y:300,r:12,angle:0,speed:1.0,state:'patrol',
   path:[{x:1050,y:120},{x:1300,y:120},{x:1300,y:600},{x:1050,y:600}],wp:0,
   detect:0,visionRange:200,visionAngle:55,target:null,searchTimer:0}
];

let alarmRaised = false;
let particles = [];
const keys = {};
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

/* ===================== 가상 조이스틱 ===================== */
const joyZone=document.getElementById('joyZone'),joyBase=document.getElementById('joyBase'),joyStick=document.getElementById('joyStick');
let joy = {active:false,dx:0,dy:0,startX:0,startY:0};
function joyStart(x,y){joy.active=true;joy.startX=x;joy.startY=y;joyBase.style.left=(x-50)+'px';joyBase.style.top=(y-50)+'px';
  joyStick.style.left=(x-22)+'px';joyStick.style.top=(y-22)+'px';joyBase.style.display='block';joyStick.style.display='block';}
function joyMove(x,y){if(!joy.active)return;let dx=x-joy.startX,dy=y-joy.startY;const max=50;
  const dist=Math.hypot(dx,dy);if(dist>max){dx=dx/dist*max;dy=dy/dist*max;}
  joy.dx=dx/max;joy.dy=dy/max;joyStick.style.left=(joy.startX+dx-22)+'px';joyStick.style.top=(joy.startY+dy-22)+'px';}
function joyEnd(){joy.active=false;joy.dx=0;joy.dy=0;joyBase.style.display='none';joyStick.style.display='none';}
joyZone.addEventListener('touchstart',e=>{const t=e.touches[0];joyStart(t.clientX,t.clientY);});
joyZone.addEventListener('touchmove',e=>{const t=e.touches[0];joyMove(t.clientX,t.clientY);e.preventDefault();},{passive:false});
joyZone.addEventListener('touchend',joyEnd);
// 데스크탑 테스트용 마우스
let mouseDown=false;
joyZone.addEventListener('mousedown',e=>{mouseDown=true;joyStart(e.clientX,e.clientY);});
window.addEventListener('mousemove',e=>{if(mouseDown)joyMove(e.clientX,e.clientY);});
window.addEventListener('mouseup',()=>{mouseDown=false;joyEnd();});

/* 버튼 */
let crouchHeld=false, actionPressed=false, flashOn=true;
document.getElementById('btnCrouch').addEventListener('touchstart',e=>{e.preventDefault();crouchHeld=!crouchHeld;});
document.getElementById('btnCrouch').addEventListener('click',()=>{crouchHeld=!crouchHeld;});
document.getElementById('btnFlash').addEventListener('touchstart',e=>{e.preventDefault();flashOn=!flashOn;});
document.getElementById('btnFlash').addEventListener('click',()=>{flashOn=!flashOn;});
document.getElementById('btnAction').addEventListener('touchstart',e=>{e.preventDefault();actionPressed=true;});
document.getElementById('btnAction').addEventListener('click',()=>{actionPressed=true;});

/* ===================== 유틸 ===================== */
function circleRectCollide(cx,cy,cr,rect){
  const nx=Math.max(rect.x,Math.min(cx,rect.x+rect.w));
  const ny=Math.max(rect.y,Math.min(cy,rect.y+rect.h));
  return Math.hypot(cx-nx,cy-ny) < cr;
}
function pointInWall(x,y){for(const w of walls){if(x>=w.x&&x<=w.x+w.w&&y>=w.y&&y<=w.y+w.h)return true;}return false;}
function hasLineOfSight(x1,y1,x2,y2){
  const dist=Math.hypot(x2-x1,y2-y1); const steps=Math.ceil(dist/6);
  for(let i=1;i<steps;i++){const t=i/steps;const px=x1+(x2-x1)*t,py=y1+(y2-y1)*t;if(pointInWall(px,py))return false;}
  return true;
}
function angleDiff(a,b){let d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return Math.abs(d);}

/* 시야 폴리곤(빛 콘) 만들기: 각도 범위로 레이 여러개 쏴서 벽에 막히는 지점 찾기 */
function castVisionPolygon(x,y,facing,halfAngle,range,rayCount){
  const pts=[{x,y}];
  for(let i=0;i<=rayCount;i++){
    const a = facing - halfAngle + (halfAngle*2)*(i/rayCount);
    const dx=Math.cos(a), dy=Math.sin(a);
    let hitX=x+dx*range, hitY=y+dy*range;
    const steps=Math.ceil(range/6);
    for(let s=1;s<=steps;s++){
      const px=x+dx*6*s, py=y+dy*6*s;
      if(pointInWall(px,py)){hitX=px;hitY=py;break;}
      if(s*6>range)break;
    }
    pts.push({x:hitX,y:hitY});
  }
  return pts;
}

/* ===================== 플레이어 이동 ===================== */
let caught=false, execTimer=0;
function updatePlayer(){
  if(caught)return;
  let mx=joy.dx, my=joy.dy;
  if(keys['w'])my=-1; if(keys['s'])my=1; if(keys['a'])mx=-1; if(keys['d'])mx=1;
  const mag=Math.hypot(mx,my);
  const spd = player.speed * (crouchHeld?0.55:1);
  if(mag>0.15){
    player.angle=Math.atan2(my,mx);
    const nx=player.x+ (mx/mag)*spd*(mag>1?1:mag);
    const ny=player.y+ (my/mag)*spd*(mag>1?1:mag);
    let blocked=false;
    for(const w of walls){if(circleRectCollide(nx,ny,player.r,w)){blocked=true;break;}}
    if(!blocked){player.x=nx;player.y=ny;}
  }
  player.crouch=crouchHeld;
  player.flashOn=flashOn;
}

/* ===================== 적 AI ===================== */
function updateEnemy(en,dt){
  // 이동 (순찰 or 수색 목표)
  let goal=null;
  if(en.state==='patrol'){
    goal=en.path[en.wp];
    if(Math.hypot(goal.x-en.x,goal.y-en.y)<8){en.wp=(en.wp+1)%en.path.length;}
  } else if(en.state==='search'){
    goal=en.target;
    if(goal && Math.hypot(goal.x-en.x,goal.y-en.y)<10){
      en.target=null;
      en.searchTimer-=dt;
      if(en.searchTimer<=0){en.state='patrol';}
    }
  }
  if(goal){
    const dx=goal.x-en.x, dy=goal.y-en.y, d=Math.hypot(dx,dy);
    if(d>1){
      en.angle=Math.atan2(dy,dx);
      const nx=en.x+(dx/d)*en.speed, ny=en.y+(dy/d)*en.speed;
      let blocked=false;
      for(const w of walls){if(circleRectCollide(nx,ny,en.r,w)){blocked=true;break;}}
      if(!blocked){en.x=nx;en.y=ny;}
    }
  } else if(en.state==='search'){
    en.searchTimer-=dt;
    if(en.searchTimer<=0)en.state='patrol';
  }

  // 감지 로직
  const dx=player.x-en.x, dy=player.y-en.y;
  const dist=Math.hypot(dx,dy);
  const ang=Math.atan2(dy,dx);
  let visRange=en.visionRange;
  if(player.crouch) visRange*=0.55;
  if(player.flashOn) visRange*=1.35; else visRange*=0.7;

  const inCone = dist<visRange && angleDiff(ang,en.angle) < (en.visionAngle*Math.PI/180);
  const seen = inCone && hasLineOfSight(en.x,en.y,player.x,player.y);

  if(seen){
    en.detect = Math.min(100, en.detect + (dist<60?4:1.6));
    en.lastSeen={x:player.x,y:player.y};
  } else {
    en.detect = Math.max(0, en.detect - 0.8);
  }

  if(en.detect>=100 && en.state!=='search' || (seen && en.detect>=100)){
    en.state='search';
    en.target={x:player.x,y:player.y};
    en.searchTimer=6;
    alarmRaised=true;
  }
  if(en.state==='search'){
    if(seen){en.target={x:player.x,y:player.y};en.searchTimer=6;}
  }

  // 잡힘 판정 (경계/수색 상태에서 근접)
  if(en.state==='search' && dist < en.r+player.r+6){
    triggerCaught();
  }
}

function triggerCaught(){
  if(caught)return;
  caught=true; execTimer=1.6;
  document.getElementById('execOverlay').style.display='flex';
}
function respawn(){
  player.x=checkpoint.x;player.y=checkpoint.y;
  caught=false;
  alarmRaised=false;
  for(const en of enemies){en.detect=0;en.state='patrol';en.target=null;}
  document.getElementById('execOverlay').style.display='none';
}

/* ===================== 은신 처치 / 상호작용 ===================== */
function handleAction(){
  if(!actionPressed)return;
  actionPressed=false;
  if(caught)return;

  // 미션 오브젝트 상호작용
  const dMis=Math.hypot(player.x-missionObj.x,player.y-missionObj.y);
  if(dMis<40 && !missionObj.done){
    missionObj.done=true;
    showMsg('선 연결 완료! 미션 성공');
    return;
  }

  // 은신 처치: 적 뒤쪽 근접 + 각도 체크
  for(const en of enemies){
    const dist=Math.hypot(player.x-en.x,player.y-en.y);
    if(dist<46){
      const toPlayerAngle=Math.atan2(player.y-en.y,player.x-en.x);
      const behind = angleDiff(toPlayerAngle, en.angle) < Math.PI*0.5; // 대략 전방 180도 밖이면 뒤
      if(!behind){ // 적이 플레이어를 등지고 있을 때 (플레이어 기준 적의 후방)
        for(let i=0;i<10;i++){
          particles.push({x:en.x,y:en.y,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3,life:30,color:'#e04040'});
        }
        enemies.splice(enemies.indexOf(en),1);
        showMsg('은신 처치 성공');
        return;
      }
    }
  }
}

let msgTimer=0;
function showMsg(t){document.getElementById('msg').textContent=t;document.getElementById('msg').style.display='block';msgTimer=90;}

/* ===================== 렌더링 ===================== */
function drawWorld(camX,camY){
  ctx.fillStyle='#3a3f2c';
  ctx.fillRect(-camX,-camY,WORLD_W,WORLD_H);
  ctx.fillStyle='#555b52';
  for(const w of walls){ctx.fillRect(w.x-camX,w.y-camY,w.w,w.h);}

  // 체크포인트
  ctx.fillStyle='#40c060';
  ctx.beginPath();ctx.arc(checkpoint.x-camX,checkpoint.y-camY,10,0,7);ctx.fill();

  // 미션 오브젝트
  if(!missionObj.done){
    ctx.fillStyle='#e0d040';
    ctx.beginPath();ctx.arc(missionObj.x-camX,missionObj.y-camY,missionObj.r,0,7);ctx.fill();
  }

  // 적
  for(const en of enemies){
    ctx.save();
    ctx.translate(en.x-camX,en.y-camY);
    ctx.rotate(en.angle);
    ctx.fillStyle = en.state==='search' ? '#e05050' : '#e0a0c0';
    ctx.beginPath();ctx.arc(0,0,en.r,0,7);ctx.fill();
    ctx.strokeStyle='#333';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(18,0);ctx.stroke();
    ctx.restore();
    // 감지 게이지 (적 머리 위)
    ctx.fillStyle='#000a';ctx.fillRect(en.x-camX-16,en.y-camY-24,32,5);
    ctx.fillStyle = en.detect>60?'#e04040':'#e0c040';
    ctx.fillRect(en.x-camX-16,en.y-camY-24,32*(en.detect/100),5);
  }

  // 플레이어
  ctx.save();
  ctx.translate(player.x-camX,player.y-camY);
  ctx.rotate(player.angle);
  ctx.fillStyle = player.crouch ? '#7ec8e3' : '#4fa8d8';
  ctx.beginPath();ctx.arc(0,0,player.r,0,7);ctx.fill();
  ctx.strokeStyle='#eee';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(16,0);ctx.stroke();
  ctx.restore();

  // 파티클
  for(const p of particles){
    ctx.fillStyle=p.color;
    ctx.globalAlpha=Math.max(0,p.life/30);
    ctx.beginPath();ctx.arc(p.x-camX,p.y-camY,3,0,7);ctx.fill();
    ctx.globalAlpha=1;
  }
}

function render(){
  const camX = Math.max(0,Math.min(player.x-canvas.width/2, WORLD_W-canvas.width));
  const camY = Math.max(0,Math.min(player.y-canvas.height/2, WORLD_H-canvas.height));

  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawWorld(camX,camY);

  // 어둠 오버레이 + 플레이어 콘 컷아웃
  ctx.save();
  ctx.fillStyle='rgba(4,4,10,0.9)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.globalCompositeOperation='destination-out';

  if(player.flashOn){
    const poly = castVisionPolygon(player.x,player.y,player.angle,50*Math.PI/180,260,26);
    ctx.beginPath();
    ctx.moveTo(poly[0].x-camX,poly[0].y-camY);
    for(const p of poly)ctx.lineTo(p.x-camX,p.y-camY);
    ctx.closePath();ctx.fill();
  } else {
    ctx.beginPath();ctx.arc(player.x-camX,player.y-camY,70,0,7);ctx.fill();
  }
  ctx.restore();

  // 실행 오버레이 텍스트는 HTML 레이어에서 처리
}

/* ===================== 메인 루프 ===================== */
let last=performance.now();
function loop(now){
  const dt=(now-last)/1000; last=now;
  if(caught){
    execTimer-=dt;
    if(execTimer<=0)respawn();
  } else {
    updatePlayer();
    for(const en of enemies)updateEnemy(en,dt);
    handleAction();
  }
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0;});

  render();

  // HUD
  const maxDetect=Math.max(0,...enemies.map(e=>e.detect));
  const bar=document.getElementById('detBar');
  bar.style.width=maxDetect+'%';
  bar.className = alarmRaised?'alert':'';
  document.getElementById('stateText').textContent = caught?'처형됨':(alarmRaised?'⚠ 경계/수색중':'잠입중');

  if(msgTimer>0){msgTimer--;if(msgTimer<=0)document.getElementById('msg').style.display='none';}

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
